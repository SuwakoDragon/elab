<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - 微机安装与调试</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div class="dut-logo">
                    <!-- 添加图标 -->
                    <img src="elab.png" alt="大连理工大学图标" class="dut-icon">
                    <div class="dut-titles">
                        <span class="dut">微机安装与调试</span>
                        <span class="course">ELAB</span>
                    </div>
                </div>
                <a href="index.html" class="back-btn">返回首页</a>
            </div>
        </header>
        
        <main class="content-wrapper">
            <aside class="toc">
                <div class="toc-header">
                    <h2>大纲导航</h2>
                </div>
                <ul class="toc-list">
                    {% for item in toc %}
                    <li class="toc-level-{{ item.level }}">
                        <a href="#{{ item.anchor }}">{{ item.title }}</a>
                    </li>
                    {% endfor %}
                </ul>
            </aside>
            
            <article class="content">
                <div class="content-header">
                    <h1>{{ title }}</h1>
                    <div class="content-meta">
                        <span>最后更新: {{ now.strftime('%Y-%m-%d') }}</span>
                    </div>
                </div>
                <div class="content-body">
                    {{ content }}
                </div>
            </article>
        </main>
        
        <footer>
            <p>微机安装与调试 &copy; {{ now.year }}</p>
        </footer>
    </div>
</body>
</html>
